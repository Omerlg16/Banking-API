<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Banking API — Démo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1F3864;
            --navy-dark: #142545;
            --gold: #d4af37;
            --gold-dark: #b8912c;
            --red: #b3261e;
            --text: #2c3550;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            font-family: 'Inter', Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 15%, rgba(212,175,55,0.18), transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(212,175,55,0.12), transparent 45%),
                linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 55%, #2a4a80 100%);
            background-attachment: fixed;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 6px 16px rgba(212,175,55,0.35);
        }

        .brand span {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 20px;
        }

        .card {
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15,32,73,0.35);
            margin-bottom: 20px;
            width: 100%;
            max-width: 380px;
            animation: rise 0.4s ease;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-family: 'Poppins', sans-serif;
            color: var(--navy);
            font-weight: 700;
            font-size: 22px;
            margin: 0 0 22px;
            text-align: center;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #8a92a8;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 14px 0 6px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid #e3e7f0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: #f9fafc;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.15);
        }

        input::placeholder {
            color: #aab1c2;
        }

        button {
            background: linear-gradient(135deg, var(--navy), var(--navy-dark));
            color: white;
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            margin-top: 22px;
            letter-spacing: 0.3px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s;
            box-shadow: 0 8px 20px rgba(31,56,100,0.35);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(31,56,100,0.45);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-danger {
            margin-top: 12px;
            background: linear-gradient(135deg, #c0392b, #8b2020);
            box-shadow: 0 8px 20px rgba(139,32,32,0.35);
        }

        .btn-danger:hover {
            box-shadow: 0 12px 26px rgba(139,32,32,0.45);
        }

        #message, #dashMessage, #regMessage {
            min-height: 18px;
            margin-top: 14px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--red);
            text-align: center;
        }

        .switch-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13.5px;
            color: #8a92a8;
        }

        .switch-link a {
            color: var(--navy);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        #loginCard, #dashboard {
            display: none;
        }

        .solde-box {
            background: linear-gradient(135deg, #f4f6fb, #eef1f7);
            border-radius: 14px;
            padding: 22px;
            text-align: center;
            margin-bottom: 6px;
            border: 1px solid #e6e9f2;
        }

        .solde-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8a92a8;
            margin-bottom: 6px;
        }

        .solde {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--navy), var(--gold-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>

    <div class="brand">
        <div class="brand-icon">🏦</div>
        <span>Banking API</span>
    </div>

    <div class="card" id="registerCard">
        <h2>Créer un compte</h2>
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="vous@exemple.com">
        <label for="regPassword">Mot de passe</label>
        <input type="password" id="regPassword" placeholder="••••••••">
        <button onclick="register()">Créer mon compte</button>
        <p id="regMessage"></p>
        <span class="switch-link">Déjà un compte ? <a onclick="showLogin()">Se connecter</a></span>
    </div>

    <div class="card" id="loginCard">
        <h2>Connexion</h2>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="vous@exemple.com">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••">
        <button onclick="login()">Se connecter</button>
        <p id="message"></p>
        <span class="switch-link">Pas encore de compte ? <a onclick="showRegister()">En créer un</a></span>
    </div>

    <div class="card" id="dashboard">
        <h2>Mon compte</h2>
        <div class="solde-box">
            <div class="solde-label">Solde disponible</div>
            <div class="solde" id="soldeAffiche">-- FC</div>
        </div>
        <label for="montant">Montant</label>
        <input type="number" id="montant" placeholder="0">
        <button onclick="deposit()">Déposer</button>
        <button onclick="withdraw()" class="btn-danger">Retirer</button>
        <p id="dashMessage"></p>
    </div>

<script>
    let token = "";

    function showLogin() {
        document.getElementById("registerCard").style.display = "none";
        document.getElementById("loginCard").style.display = "block";
    }

    function showRegister() {
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("registerCard").style.display = "block";
    }

    async function register() {
        const email = document.getElementById("regEmail").value;
        const password = document.getElementById("regPassword").value;

        const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (data.error) {
            document.getElementById("regMessage").innerText = data.error;
            return;
        }

        document.getElementById("email").value = email;
        document.getElementById("regMessage").innerText = "";
        showLogin();
        document.getElementById("message").innerText = "Compte créé, connecte-toi.";
    }

    async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (data.error) {
            document.getElementById("message").innerText = data.error;
            return;
        }

        token = data.token;
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        checkBalance();
    }

    async function checkBalance() {
        const response = await fetch("/api/accounts/me/balance", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        });
        const data = await response.json();
        if (data.solde !== undefined) {
            document.getElementById("soldeAffiche").innerText = data.solde + " FC";
        }
    }

    async function deposit() {
        const montant = document.getElementById("montant").value;
        const response = await fetch("/api/accounts/me/deposit", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ amount: parseInt(montant) })
        });
        const data = await response.json();
        if (data.error) {
            document.getElementById("dashMessage").innerText = data.error;
        } else {
            document.getElementById("soldeAffiche").innerText = data.solde + " FC";
            document.getElementById("dashMessage").innerText = "Dépôt effectué !";
        }
    }

    async function withdraw() {
        const montant = document.getElementById("montant").value;
        const response = await fetch("/api/accounts/me/withdraw", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ amount: parseInt(montant) })
        });
        const data = await response.json();
        if (data.error) {
            document.getElementById("dashMessage").innerText = data.error;
        } else {
            document.getElementById("soldeAffiche").innerText = data.solde + " FC";
            document.getElementById("dashMessage").innerText = "Retrait effectué !";
        }
    }
</script>
</body>
</html>
